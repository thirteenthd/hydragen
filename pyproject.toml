[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydragen"
version = "0.35.0"
description = "Hydragen: High-Concurrency Tiered PagedMoE Inference Engine combining vLLM batching with Triton expert paging"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "thirteenthd", email = "thirteenthd@users.noreply.github.com"}
]
urls = {Repository = "https://github.com/thirteenthd/Hydragen"}
dependencies = [
    "numpy",
    "gguf>=0.10.0",
    "torch>=2.4.0",
    "triton>=3.0.0",
    "psutil",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6.0"]

[project.scripts]
hydragen = "hydragen.cli:main"

[project.entry-points."vllm.general_plugins"]
hydragen_gguf = "hydragen.vllm_plugin:register_strata_vllm_plugin"
strata_gguf = "hydragen.vllm_plugin:register_strata_vllm_plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hydragen*"]

[tool.setuptools.package-data]
"hydragen.server" = ["libstrata_iq_kernels.so", "web/**/*", "web/*", "*.jinja", "chat_template.jinja"]
